<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <header>
        <h1>University Registration Form</h1>
        <p>Please fill out the form below to register</p>
        <hr>
    </header>
     <main>

       <form>  

        <h2>Personal Details</h2>

        <label for="First">First Name</label>
        <input type="text" id="First" name="First-name" placeholder="e.g: Aman">
        <br><br>

        <label for="Last">Last Name</label>
        <input type="text" id="Last" name="Last-name" placeholder="Raj">
        <br><br>

        <label for="Dob">Date of Birth</label>
        <input type="date" id="Dob" name="Dob">
        <br><br>

        <h3>Gender:</h3>

        <input type="radio" id="Male" name="Gender" value="Male">
        <label for="Male">Male</label>
        <br><br>

        <input type="radio" id="Female" name="Gender" value="Female">
        <label for="Female">Female</label>
        <br><br>

        <input type="radio" id="Other" name="Gender" value="Other">
        <label for="Other">Other</label>
      
        <h3>Upload Your Photo: </h3>

        <input type="file"  name="Photo" accept="image/*">


     

       <hr>

       <h2>Contact Information</h2>
       
       <label for="Email">Email Address :</label>
       <input type="email" id="Email" name="Email" placeholder="your@example.com">
       <br><br>

       <label for="Phone">Phone Number :</label>
       <input type="tel" id="Phone" name="Phone" placeholder="e.g. 9801353245" required>
       <br><br>

         <label for="Address">Mailing Address :</label>
         <br>
        <textarea id="Address" name="Address" rows="4" cols="40" placeholder="Enter your permanent Address"></textarea>
  
    
     <hr>

     <h2>Academic Information</h2>

     <label for="Course">Select your Course </label>
     <br>


     <select name="Course" id="Course">
     <option value="">--Select Course --</option>
     <option value="Cse">Cse</option>
     <option value="It">It</option>
     <option value="Me">Me</option>
     </select>

     <h3>ExtraCurricular Activities</h3>

       <label for="Sports">Sports</label>
       <input type="checkbox" id="Sports" name="Interest" value="Sports">
       <br><br>

       <label for="Music">Music</label>
       <input type="checkbox" id="Music" name="Interest" value="Music">
       <br><br>

       <label for="Dance">Dance</label>
       <input type="checkbox" id="Dance" name="Interest" value="Dance">
     
       <hr>
       <h2>Create your Account</h2>

       <label for="Password">Create a Password</label>
       <input type="Password" id="Password" name="Password">
       <br><br>
       <label for="SecurityQuestion">Security Question</label>
       <select name="SecurityQuestion" id="SecurityQuestion">
       <option value="Whats your dog name">Whats your dog name</option>
       <option value="Which is your Fav PLace">Which is your Fav PLace</option>
       <option value="Which is your Fav Actor">Which is your fav Actor</option>
       </select>
       <br><br>
        <label for="SecurityAnswer">Security Answer</label>
        <input type="text" name="SecurityAnswer" id="SecurityAnswer">
       <br><br>
        <input type="checkbox" id="Agree" name="Agree" value="Yes">
        <label for="Agree">I agree to the Terms and Conditions</label>

<hr>
        
        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>
     </form>

    </main>
</body>
</html>
